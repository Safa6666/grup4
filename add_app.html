<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartScope - إضافة تطبيق</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="aboutus.html">من نحن</a></li>
                <li><a href="apps.html">التطبيقات</a></li>
                <li><a href="add_app.html">إضافة تطبيق</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="add-app-section">
            <h1>إضافة تطبيق جديد</h1>
            
            <form id="appForm">
                <div class="form-group">
                    <label for="appName">اسم التطبيق:</label>
                    <input type="text" id="appName" name="appName" required>
                    <small>أحرف هجائية إنجليزية فقط بدون فراغات (يجب أن يبدأ بحرف)</small>
                </div>

                <div class="form-group">
                    <label for="companyName">اسم الشركة المطورة:</label>
                    <input type="text" id="companyName" name="companyName" required>
                    <small>أحرف هجائية إنجليزية فقط (يمكن إضافة فراغات)</small>
                </div>

                <div class="form-group">
                    <label for="website">الموقع الإلكتروني (URL):</label>
                    <input type="url" id="website" name="website" required>
                    <small>يجب أن يبدأ بـ http:// أو https://</small>
                </div>

                <div class="form-group">
                    <label>مجاني/غير مجاني:</label>
                    <div class="radio-group">
                        <input type="radio" id="free" name="pricing" value="مجاني" required>
                        <label for="free">مجاني</label>
                        
                        <input type="radio" id="paid" name="pricing" value="غير مجاني">
                        <label for="paid">غير مجاني</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">مجال الاستخدام:</label>
                    <select id="category" name="category" required>
                        <option value="">اختر مجال الاستخدام</option>
                        <option value="Education">Education</option>
                        <option value="E-Commerce">E-Commerce</option>
                        <option value="Robotics">Robotics</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Design">Design</option>
                        <option value="Finance">Finance</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">شرح مختصر عن التطبيق:</label>
                    <textarea id="description" name="description" rows="4" required placeholder="اكتب شرحاً مختصراً عن التطبيق (10 أحرف على الأقل)..."></textarea>
                    <small>يجب أن يحتوي على الأقل 10 أحرف</small>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">إرسال التطبيق</button>
                    <button type="reset" id="resetBtn">إعادة التعيين</button>
                    <button type="button" id="testBtn" class="btn-secondary">ملء بيانات تجريبية</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 SmartScope. جميع الحقوق محفوظة</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="myFunctions.js"></script>
</body>
</html>
